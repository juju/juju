  spaces_gce:
    provider: gce
    gh_eligible: false
    description: >
      Network spaces on GCE: machines in spaces.
    keywords: [spaces, subnet, gce]
    paths: []
  static_analysis:
    provider: none
    gh_eligible: true
    description: >
      Repo hygiene checks: copyright headers, go doc/lint, shellcheck and
      python lint of tests, schema and DDL checks.
    keywords: [static analysis, lint, shellcheck, schema]
    paths:
      - tests/suites/static_analysis/**
