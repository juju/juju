      - domain/network/**
  examples:
    provider: lxd
    gh_eligible: true
    description: >
      Example/test-charm smoke paths used as templates by other suites;
      exercises basic deploy and hook patterns.
    keywords: [examples, test charms]
    paths: []
  firewall:
    provider: ec2
    gh_eligible: false
    description: >
      Firewall rules and juju expose on public clouds: ssh access restricted
      by expose rules, exposed endpoints in bundles, rule changes propagate.
    keywords: [firewall, expose, ssh access, rules]
    paths:
      - internal/worker/firewaller/**
      - internal/worker/caasfirewaller/**
      - apiserver/facades/controller/firewaller/**
      - domain/network/**
  hooks:
    provider: lxd
    gh_eligible: true
    description: >
      Hook lifecycle: dispatch script routes hook events, start hook fires
      again after machine reboot, hooks see correct environment.
    keywords: [hooks, dispatch, reboot, start hook]
    paths:
      - internal/worker/uniter/**
      - internal/worker/reboot/**
  hooktools:
    provider: lxd
    gh_eligible: true
    description: >
      Hook tools available to charms: relation-* / status-set / storage-*
      and other jujuc commands behave correctly inside hooks.
    keywords: [hook tools, jujuc, relation-get, status-set, storage-get]
    paths:
      - internal/worker/uniter/runner/**
      - internal/worker/uniter/runner/jujuc/**
  kubeflow:
    provider: k8s
    gh_eligible: false
    description: >
      Deploying the kubeflow bundle on K8s (long-running, deprecated infra).
    keywords: [kubeflow, bundle, k8s]
    paths: []
  machine:
    provider: lxd
    gh_eligible: true
    description: >
      Machine management: juju show-machine provisioning info, machine logs,
      add-machine/remove-machine lifecycle.
    keywords: [machine, add-machine, show-machine, provisioning]
    paths:
      - domain/machine/**
      - cmd/juju/machine/**
      - internal/worker/machiner/**
  model:
    provider: lxd
    gh_eligible: true
    description: >
      Model lifecycle: model config, multi-model operations, model metrics,
      destroy-model with force, model status output.
    keywords: [model, model-config, destroy-model, status, metrics]
    paths:
      - domain/model/**
      - domain/modelconfig/**
      - cmd/juju/model/**
      - domain/status/**
      # blast-radius: model status aggregates app/relation/network data.
      - domain/application/**
      - domain/relation/**
      - domain/network/**
      - domain/machine/**
      - cmd/juju/status/**
  network:
    provider: lxd
    gh_eligible: true
    description: >
      Network health on a deployed model: connectivity between units and
      controller, endpoint addresses.
    keywords: [network, connectivity, endpoints]
    paths:
      - domain/network/**
      - core/network/**
      - internal/worker/firewaller/**
      - internal/worker/caasfirewaller/**
      - apiserver/facades/controller/firewaller/**
  ovs_maas:
    provider: maas
    gh_eligible: false
    description: >
      Open vSwitch netplan configuration rendered on MAAS machines.
    keywords: [ovs, netplan, maas, bridge]
    paths: []
  refresh:
    provider: lxd
    gh_eligible: true
    description: >
      juju refresh: upgrading a charm to a new revision/channel, switching
      charm, refresh rollback on failure, hooks run post-refresh.
    keywords: [refresh, upgrade-charm, switch, channel]
    paths:
      - cmd/juju/application/refresh.go
      - domain/upgrade/**
      - internal/upgrades/**
      - internal/upgradesteps/**
  relations:
    provider: lxd
    gh_eligible: true
    description: >
      Relations between applications: data exchange via relation-get/put,
      departing unit data cleanup, relation list, relation model-settings,
      recursive subordinate units.
    keywords: [relation, relate, relation data, subordinate, departing unit]
    paths:
      - domain/relation/**
      - internal/worker/uniter/relation/**
      - cmd/juju/application/integrate.go
      - apiserver/facades/agent/uniter/**
      # blast-radius: shared relation plumbing with CMR + app/unit state.
      - domain/crossmodelrelation/**
      - domain/application/**
      - domain/unitstate/**
      - domain/network/**
      - core/network/**
  resources:
