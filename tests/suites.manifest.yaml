    keywords: [controller charm, prometheus, controller upgrade]
    paths:
      - domain/controller/**
      - internal/worker/upgradestepscontroller/**
  coslite:
    provider: k8s
    gh_eligible: false
    description: >
      Deploying the cos-lite observability bundle on a K8s cloud and exposing
      dashboards.
    keywords: [cos-lite, observability, bundle, k8s]
    paths: []
  credential:
    provider: lxd
    gh_eligible: true
    description: >
      Cloud credentials: juju add-credential / remove-credential on the
      controller and model, credential validation errors.
    keywords: [credential, add-credential, clouds, credentials]
    paths:
