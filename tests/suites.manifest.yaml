    gh_eligible: true
    description: >
      Charm resources: upload/attach/refresh resources, container resources on
      K8s, empty resources, resource visibility in hooks and status.
    keywords: [resource, attach-resource, pod-spec, oci image]
    paths:
      - domain/resource/**
      - domain/containerimageresourcestore/**
      - cmd/juju/resource/**
      - core/resources/**
      - internal/resource/**
  secrets_iaas:
    provider: lxd
    gh_eligible: true
    description: >
      Juju secrets on machines: add/grant/rotate/remove secrets, secret
      backends incl. vault, peer and owner secret rows, drain on unit removal,
      obsolete revisions, non-leader owned secrets, hook commit semantics.
    keywords: [secret, secrets, vault, grant, rotate, drain, backend]
    paths:
      - core/secrets/**
      - domain/secret/**
      - domain/secretbackend/**
      - internal/secrets/**
      - cmd/juju/secrets/**
      - cmd/juju/secretbackends/**
      - internal/worker/uniter/secrets/**
      - internal/worker/secret*/**
      - apiserver/facades/agent/secrets*/**
      - apiserver/facades/client/secrets/**
      - apiserver/facades/controller/usersecrets*/**
      - apiserver/facades/controller/crossmodelsecrets/**
  secrets_k8s:
    provider: k8s
    gh_eligible: true
    description: >
      Juju secrets on Kubernetes: add/grant secrets backed by K8s secrets,
      user secrets, drain on remove-unit, parallel secret adds, secrets across
      CMR offers.
    keywords: [secret, k8s secret, user secret, drain, rbac, offer]
    paths:
      - core/secrets/**
      - domain/secret/**
      - internal/secrets/**
      - cmd/juju/secrets/**
      - internal/provider/kubernetes/**
      - internal/worker/uniter/secrets/**
      - internal/worker/secrets*/**
      - apiserver/facades/agent/secrets*/**
      - apiserver/facades/client/secrets/**
  sidecar:
    provider: k8s
    gh_eligible: true
    description: >
      Sidecar (k8s) charms: deploy/remove and force-remove applications,
      pebble notices and checks drive hooks, credential-get, rootless
      deployments.
    keywords: [sidecar, pebble, notices, checks, rootless, k8s]
