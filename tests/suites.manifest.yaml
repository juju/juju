# Suite manifest for LLM-driven CI test selection.
#
# Single source of truth for:
#   - provider the suite bootstraps against (matches tests/main.sh -p)
#   - gh_eligible: can run on our GH self-hosted runners (lxd / microk8s only)
#   - already_required: suite is already covered by a separate CI workflow
#     (context-tests.yml → smoke.yml runs it on every PR; postgresql-k8s.yml
#     runs it on release-branch pushes). The selector never picks or
#     must-runs it, so it never doubles a runner slot.
#   - description: hand-curated, <=40 words, phrased as *observable behavior
#     the suite verifies end-to-end* (this becomes the LLM question criteria)
#   - keywords: quick recall signal for the selection prompt
#   - paths: globs whose specificity feeds the ranking. A glob used by
#     one suite (precise ownership) scores 1.0; one shared by N suites
#     (a hub like internal/worker/uniter/**) scores 1/N. The top
#     max_runs suites by (static specificity + threshold-passing LLM
#     p(yes)) run; the rest are trimmed and shown in the PR comment.
#
# Selection policy lives in tests/tools/select_suites.py; eval harness in
# tests/tools/eval_selector.py. When adding a suite under tests/suites/,
# add an entry here or tests/tools unit tests will fail.
#
# Tuned defaults for the LLM layer. `threshold` gates the LLM lift:
# p(yes) at/above it is added to the static score; below it the answer
# adds nothing, so an LLM-only pick needs real confidence and cannot
# fill runner slots from a docs-only PR.
threshold: 0.6
# Hard ceiling on suites executed per PR: the top max_runs ranked suites
# run, the rest are trimmed and reported. Protects the runner pool.
max_runs: 6

suites:
  actions:
    provider: lxd
    gh_eligible: true
    description: >
      juju run-action end to end: action params validation, running actions
      on units and machines, action output and error status, running hooks
      triggered by actions.
    keywords: [action, run-action, action params, operator]
    paths:
      - cmd/juju/action/**
      - core/operation/**
      - domain/application/state/actions.go
      - internal/worker/uniter/actions/**
      - internal/worker/uniter/**
      - apiserver/facades/client/action/**
      - apiserver/facades/agent/uniter/**
  agents:
    provider: lxd
    gh_eligible: true
    description: >
      Machine and unit agent lifecycle: charm revision updater bumps updated
      charm revision and unit agent restarts to run the new charm.
    keywords: [agent, charmrevisionupdater, revision, restart]
    paths:
      - internal/worker/charmrevisioner/**
      - internal/upgradesteps/**
      - internal/worker/upgradestepsagent/**
      - internal/worker/upgradestepscontroller/**
      - agent/**
  appdata:
    provider: lxd
    gh_eligible: true
    description: >
      Application data integrity: app and unit tags, annotations and settings
      survive restarts and scaling; juju show-unit shows expected application
      data.
    keywords: [application data, tags, annotations, settings]
    paths:
      - domain/application/**
      - domain/unitstate/**
      - internal/worker/uniter/**
      - domain/relation/**
      - domain/annotation/**
  authorized_keys:
    provider: lxd
    gh_eligible: true
    description: >
      SSH key management: juju add-ssh-key / authorize-key propagate keys to
      machines, ssh into machines and units works, keys removed on model
      teardown.
    keywords: [ssh, authorized_keys, add-ssh-key, sshkeys]
    paths:
      - cmd/juju/sshkeys/**
      - domain/keymanager/**
      - apiserver/facades/client/keymanager/**
  bootstrap:
    provider: lxd
    gh_eligible: true
    description: >
      Controller bootstrap: bootstrap against simplestreams with a custom
      agent stream succeeds, controller becomes available and reachable.
    keywords: [bootstrap, simplestreams, agent stream, controller]
    paths:
      - environs/bootstrap/**
      - environs/**
      - internal/bootstrap/**
      - scripts/simplestreams/**
  caasadmission:
    provider: k8s
    gh_eligible: true
    description: >
      K8s admission webhook for controllers: adding models to a K8s cluster
      and removing the controller model; webhook does not block or chicken-egg
      controller operations.
    keywords: [admission, webhook, caas, model operator]
    paths:
      - internal/worker/caasadmission/**
      - caas/**
      - internal/provider/kubernetes/**
  charmhub:
    provider: lxd
    gh_eligible: true
    description: >
      Charmhub client commands: juju find/info/download interact with
      charmhub and return correct charm metadata, revisions and download
    keywords: [charmhub, find, info, download, charm]
    paths:
      - cmd/juju/charmhub/**
      - internal/charmhub/**
      - internal/downloader/**
  ck:
    provider: maas
    gh_eligible: false
    description: >
      Deploying Canonical Kubernetes (CK) bundle on the provider cloud and
      adding it as a Juju cloud.
    keywords: [ck, canonical-kubernetes, k8s cloud, bundle]
    paths: []
  cli:
    provider: lxd
    gh_eligible: true
    description: >
      Core CLI on a live controller: display-clouds, local charm deploy,
      model-config, model-defaults, model-constraints, unregister,
      disable-command blocks, juju diff-bundle.
    keywords: [cli, model-config, model-defaults, constraints, block, diff-bundle]
    paths:
      - cmd/juju/**
      - internal/configschema/**
      - domain/modelconfig/**
      - domain/modeldefaults/**
      - domain/constraints/**
      - domain/blockcommand/**
      - internal/bundle/**
  cloud_azure:
    provider: azure
    gh_eligible: false
    description: >
      Azure cloud specifics: managed identity auth, storage account types for
      controllers and models.
    keywords: [azure, managed identity, storage account]
    paths: []
  cloud_gce:
    provider: gce
    gh_eligible: false
    description: >
      GCE cloud specifics: pro images, GPU instances, storage pools, root disk
      sources, service-account credentials.
    keywords: [gce, gpu, pro image, storage pool, credential]
    paths: []
  cmr:
    provider: lxd
    gh_eligible: true
    description: >
      Cross-model relations: juju offer/consume, offer permissions and
      find/find-non-admin, relation data across models, offer removal,
      cross-model secrets.
    keywords: [offer, consume, cross-model, cmr, remote application]
    paths:
      - core/crossmodel/**
      - domain/crossmodelrelation/**
      - cmd/juju/crossmodel/**
      - internal/worker/remoterelationconsumer/**
      - apiserver/facades/controller/crossmodelrelations/**
      - apiserver/facades/controller/crossmodelsecrets/**
