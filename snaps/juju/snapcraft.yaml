name: juju
version: 4.2-alpha4
summary: Juju - a model-driven operator lifecycle manager for K8s and machines
license: AGPL-3.0
description: |
  A model-driven **universal operator lifecycle manager** for multi cloud and hybrid cloud application management on K8s and machines.

  **What is an operator lifecycle manager?**
  Kubernetes operators are containers with operations code, that drive your applications on K8s. Juju is an operator lifecycle manager that manages the installation, integration and configuration of operators on the cluster. Juju also extends the idea of operators to traditional application management on Linux and Windows servers, or cloud instances.

  **Model-driven operations and integration**
  Organise your operators into models, which group together applications that can be tightly integrated on the same substrate and operated by the same team. Capture resource allocation, storage, networking and integration information in the model to simplify ongoing operations.

  **Better day-2 operations**
  Each operator code package, called a charm, declares methods for actions like backup, restore, or security audit. Calling these methods provides remote administration of the application with no low-level access required.

  **Learn more**

   - https://juju.is/
   - https://discourse.charmhub.io/
   - https://github.com/juju/juju

  **Note**
  This snap needs to read any relevant locally stored cloud credentials in order to manage resources on your behalf in a specified cloud.
  It also can read private ssh keys. The privileged interface auto connections include:
   - lxd
   - ssh-keys

confinement: strict
grade: devel
base: core24

apps:
  juju:
    environment:
      # Make sure we access snap binaries first (i.e. juju-metadata lp:1759013)
      PATH: "$SNAP/bin:$SNAP/usr/bin:$SNAP/opt/jaas/bin:/snap/bin:$PATH"
      SSH_SK_HELPER: "$SNAP/usr/lib/openssh/ssh-sk-helper"
      SSH_PKCS11_HELPER: "$SNAP/usr/lib/openssh/ssh-pkcs11-helper"
    command: bin/juju
    plugs:
      - network
      - network-bind
      - ssh-keys
      - lxd
      # Needed to read the JAAS plugin binary
      - jaas-plugin
      # Needed so that juju can still use the real ~/.local/share/juju.
      - dot-local-share-juju
      # Needed to read lxd config.
      - config-lxd
      # Needed to read ~/.kube, ~/.novarc, ~/.aws etc.
      - dot-aws
      - dot-azure
      - dot-google
      - dot-kubernetes
      - dot-maas
      - dot-minikube-cacrt
      - dot-minikube-profiles
      - dot-openstack
      - dot-oracle
      # Needed so that arbitrary cloud/credential yaml files can be read and backups written.
      - home
      # Needed to that SSO via the web browser can work.
      - desktop
      # Needed for FIDO/U2F security key support (e.g. YubiKey) with juju ssh.
      # This interface is not auto-connected; users must run:
      #   sudo snap connect juju:u2f-devices
      # We do not want this to be auto-connected.
      - u2f-devices
    completer: usr/share/bash-completion/completions/juju
  fetch-oci:
    daemon: oneshot
    command: wrappers/fetch-oci
    start-timeout: 1m
    stop-timeout: 35s
    plugs:
      - network

parts:
  unsquashfs:
    plugin: nil
    stage-packages:
      - squashfs-tools
    prime:
      - -usr/lib/python3/dist-packages

  wrappers:
    plugin: dump
    source: snap/local

  jujuagentd:
    plugin: nil
    source: .
    build-snaps:
      - go/1.26/stable
    override-build: |
      set -ex

      # TODO: use make plugin.
      export GOTOOLCHAIN=go1.26.0+auto
      export GOBIN="${CRAFT_PART_INSTALL}/bin"
      export CGO_ENABLED=0
      export GO_LDFLAGS='-s -w -X github.com/juju/juju/core/version.GitCommit= -X github.com/juju/juju/core/version.GitTreeState= -X github.com/juju/juju/core/version.Grade= -X github.com/juju/juju/core/version.build= -X github.com/juju/juju/internal/cloudconfig/podcfg.JujudOCINamespace='
      go mod download
      go install -ldflags "${GO_LDFLAGS}" github.com/juju/juju/cmd/jujuagentd

  juju:
    after:
      - jujuagentd
    plugin: nil
    source: .
    build-snaps:
      - go/1.26/stable
    override-build: |
      set -ex

      # TODO: use make plugin.
      export GOTOOLCHAIN=go1.26.0+auto
      export GOBIN="${CRAFT_PART_INSTALL}/bin"
      export CGO_ENABLED=0
      export GO_LDFLAGS='-s -w -extldflags "-static" -X github.com/juju/juju/core/version.GitCommit= -X github.com/juju/juju/core/version.GitTreeState= -X github.com/juju/juju/core/version.Grade= -X github.com/juju/juju/core/version.build= -X github.com/juju/juju/internal/cloudconfig/podcfg.JujudOCINamespace='
      go mod download
      go install -ldflags "${GO_LDFLAGS}" github.com/juju/juju/cmd/juju github.com/juju/juju/cmd/jujuc github.com/juju/juju/cmd/plugins/juju-metadata

      for completion in etc/bash_completion.d/*; do
        install -D ${completion} ../install/usr/share/bash-completion/completions/$(basename ${completion})
      done
      jujuagentd=${CRAFT_STAGE}/bin/jujuagentd
      version=$($jujuagentd version)
      hash=$(sha256sum $jujuagentd | cut -d " " -f 1)
      cat > jujuagentd-versions.yaml <<EOF
      versions:
        - version: $version
          sha256: $hash
      EOF
      cp -a jujuagentd-versions.yaml ${CRAFT_PART_INSTALL}/bin
    stage-packages:
      - openssh-client

hooks:
  connect-plug-peers: {}
  disconnect-plug-peers: {}
  post-refresh: {}

slots:
  juju-bin:
    interface: content
    content: juju
    source:
      read:
        - $SNAP/bin

plugs:
  peers:
    interface: content
    content: microk8s
    target: $SNAP_DATA/microk8s

  jaas-plugin:
    interface: content
    content: jaas-plugin
    target: $SNAP/opt/jaas/bin

  dot-local-share-juju:
    interface: personal-files
    write:
      - $HOME/.local/share/juju

  config-lxd:
    interface: personal-files
    read:
      - $HOME/snap/lxd/common/config

  dot-aws:
    interface: personal-files
    read:
      - $HOME/.aws

  dot-azure:
    interface: personal-files
    read:
      - $HOME/.azure

  dot-google:
    interface: personal-files
    read:
      - $HOME/.config/gcloud

  dot-kubernetes:
    interface: personal-files
    read:
      - $HOME/.kube

  dot-maas:
    interface: personal-files
    read:
      - $HOME/.maasrc

  dot-minikube-cacrt:
    interface: personal-files
    read:
      - $HOME/.minikube/ca.crt

  dot-minikube-profiles:
    interface: personal-files
    read:
      - $HOME/.minikube/profiles

  dot-oracle:
    interface: personal-files
    read:
      - $HOME/.oci

  dot-openstack:
    interface: personal-files
    read:
      - $HOME/.novarc
