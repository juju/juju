project: juju
kill-timeout: 3h
workers: 1

environment:
  CI: "$(HOST: echo $CI)"

  # Bootstrap configuration — overridable from the host environment.
  BOOTSTRAP_PROVIDER: '$(HOST: echo "${BOOTSTRAP_PROVIDER:-lxd}")'
  BOOTSTRAP_CLOUD: '$(HOST: echo "${BOOTSTRAP_CLOUD:-}")'
  BOOTSTRAP_BASE: '$(HOST: echo "${BOOTSTRAP_BASE:-}")'
  BOOTSTRAP_ARCH: '$(HOST: echo "${BOOTSTRAP_ARCH:-}")'
  BOOTSTRAP_REGION: '$(HOST: echo "${BOOTSTRAP_REGION:-}")'
  BOOTSTRAP_REUSE: '$(HOST: echo "${BOOTSTRAP_REUSE:-true}")'
  BOOTSTRAP_REUSE_LOCAL: '$(HOST: echo "${BOOTSTRAP_REUSE_LOCAL:-}")'
  BUILD_ARCH: '$(HOST: echo "${BUILD_ARCH:-}")'
  MODEL_ARCH: '$(HOST: echo "${MODEL_ARCH:-}")'
  BUILD_AGENT: '$(HOST: echo "${BUILD_AGENT:-false}")'
  CURRENT_LTS: "ubuntu@22.04"
  DESTROY_TIMEOUT: '$(HOST: echo "${DESTROY_TIMEOUT:-15m}")'

  # Cloud configuration passed to the runner systems.
  AWS_DEFAULT_REGION: '$(HOST: echo "${AWS_DEFAULT_REGION:-}")'
  EC2_INSTANCE_TYPE: '$(HOST: echo "${EC2_INSTANCE_TYPE:-m5.xlarge}")'
  EC2_INSTANCE_PROFILE: '$(HOST: echo "${EC2_INSTANCE_PROFILE:-}")'
  AZURE_SUBSCRIPTION_ID: '$(HOST: echo "${AZURE_SUBSCRIPTION_ID:-}")'
  AZURE_CLIENT_ID: '$(HOST: echo "${AZURE_CLIENT_ID:-}")'
  AZURE_CLIENT_SECRET: '$(HOST: echo "${AZURE_CLIENT_SECRET:-}")'
  AZURE_TENANT_ID: '$(HOST: echo "${AZURE_TENANT_ID:-}")'
  GOOGLE_APPLICATION_CREDENTIALS: '$(HOST: echo "${GOOGLE_APPLICATION_CREDENTIALS:-}")'
  CLOUDSDK_COMPUTE_REGION: '$(HOST: echo "${CLOUDSDK_COMPUTE_REGION:-}")'

  # Path helpers for sourcing libraries.
  TESTSLIB: $SPREAD_PATH/tests/lib

backends:
  lxd:
    type: adhoc
    allocate: |
      export PATH="/snap/bin:$PATH"

      BASE="${BASE:-noble}"
      VM_NAME="${VM_NAME:-juju-ubuntu-${BASE}-${RANDOM}}"
      DISK="${DISK:-40}"
      CPU="${CPU:-8}"
      MEM="${MEM:-16}"

      cloud_config="$(mktemp)"
      # Spread runs allocate under xtrace; keep the spread password out
      # of the expanded command line in the CI log. Escape sed
      # replacement metacharacters (&, \, and the | delimiter) in the
      # password so one containing them cannot corrupt the user-data.
      { set +x; } 2>/dev/null
      password_escaped="$(printf '%s' "${SPREAD_PASSWORD}" | sed -e 's/[&|\\]/\\&/g')"
      sed "s|SPREAD_PASSWORD|${password_escaped}|g" tests/spread/cloud-config.yaml > "$cloud_config"
      set -x

      launch_args=()
      if [[ -e /dev/kvm ]]; then
          launch_args+=(--vm)
      else
          echo "KVM is unavailable; using a nested LXD container"
          # The nested LXD daemon must be able to create AppArmor profiles
          # for Juju's unprivileged controller containers. The runner is
          # disposable, and the test system remains isolated by its LXD host.
          launch_args+=(-c security.nesting=true -c security.privileged=true)
          launch_args+=(-c raw.lxc=lxc.apparmor.profile=unconfined)
      fi

      # The user-data carries the spread password; keep its expansion
      # out of the xtraced command line.
      { set +x; } 2>/dev/null
      lxc launch "${launch_args[@]}" \
          "ubuntu:${BASE}" \
          "${VM_NAME}" \
          -c user.user-data="$(cat "$cloud_config")" \
          -c limits.cpu="${CPU}" \
          -c limits.memory="${MEM}GiB" \
          -d root,size="${DISK}GiB"
      set -x

      # Wait for the spread user to be created by cloud-init.
      while ! lxc exec "${VM_NAME}" -- id -u spread &>/dev/null; do sleep 0.5; done

      rm "$cloud_config"

      # Set the instance address for spread.
      ADDRESS "$(lxc ls -f csv | grep "${VM_NAME}" | cut -d"," -f3 | cut -d" " -f1)"
    discard: |
      export PATH="/snap/bin:$PATH"
      instance_name="$(lxc ls -f csv | grep juju | grep $SPREAD_SYSTEM_ADDRESS | cut -f1 -d",")"
      lxc delete -f $instance_name

    environment:
      # Credentials for an explicit LXD-to-AWS bootstrap travel over the
      # spread SSH channel; they must never ride in EC2 user-data, which
      # any process on the instance reads back via IMDS
      # (169.254.169.254/latest/user-data) and anyone with
      # DescribeInstanceAttribute fetches from the API.
      AWS_ACCESS_KEY_ID: '$(HOST: echo "${AWS_ACCESS_KEY_ID:-}")'
      AWS_SECRET_ACCESS_KEY: '$(HOST: echo "${AWS_SECRET_ACCESS_KEY:-}")'
      AWS_SESSION_TOKEN: '$(HOST: echo "${AWS_SESSION_TOKEN:-}")'

    prepare: |
      # Provider-specific setup inside the runner instance.
      case "${BOOTSTRAP_PROVIDER}" in
      "lxd")
          snap install lxd
          lxd waitready --timeout=30
          lxd init --auto
          ;;
      "ec2"|"aws")
          snap install aws-cli --classic 2>/dev/null || true
          ;;
      "gce"|"google")
          snap install google-cloud-cli --classic 2>/dev/null || true
          ;;
      "azure")
          snap install azure-cli 2>/dev/null || true
          ;;
      "k8s"|"microk8s")
          snap install microk8s --classic --channel latest/stable
          microk8s status --wait-ready
          ;;
      esac

    systems:
      - ubuntu-22.04:
          username: spread
          workers: 1
      - ubuntu-24.04:
          username: spread
          workers: 1

  ec2:
    type: adhoc
    allocate: |
      REGION="${AWS_DEFAULT_REGION:-us-east-1}"
      if [[ -z "${EC2_INSTANCE_PROFILE:-}" ]]; then
        FATAL "EC2_INSTANCE_PROFILE must name a pre-provisioned EC2 instance profile"
      fi
      # od is coreutils; xxd (vim-common) is not on minimal runner images.
      PREFIX="spread-ci-$(od -An -tx1 -N6 /dev/urandom | tr -d ' \n')"

      # Cleanup resources on failure during allocation.
      ALLOCATE_OK=false
      cleanup_allocate() {
        if [ "$ALLOCATE_OK" = true ]; then return; fi
        if [ -n "${INSTANCE_ID:-}" ]; then
          aws ec2 terminate-instances --region "$REGION" --instance-ids "$INSTANCE_ID" 2>/dev/null || true
          # Termination is asynchronous; wait it out so the security
          # group delete below does not hit a dependency violation and
          # orphan the group (with its SSH rule) in the account.
          aws ec2 wait instance-terminated --region "$REGION" \
            --instance-ids "$INSTANCE_ID" 2>/dev/null || true
        fi
        if [ -n "${SG_ID:-}" ]; then
          aws ec2 delete-security-group --region "$REGION" --group-id "$SG_ID" 2>/dev/null || true
        fi
        if [ -n "${PREFIX:-}" ]; then
          aws ec2 delete-key-pair --region "$REGION" --key-name "$PREFIX" 2>/dev/null || true
        fi
        rm -f "${PEM_FILE:-}"
      }
      trap cleanup_allocate EXIT

      # Map system name to Ubuntu AMI filter.
      case "${SPREAD_SYSTEM}" in
      *22.04*)
        AMI_FILTER="ubuntu/images/hvm-ssd*/ubuntu-jammy-22.04-amd64-server-*"
        ;;
      *24.04*)
        AMI_FILTER="ubuntu/images/hvm-ssd*/ubuntu-noble-24.04-amd64-server-*"
        ;;
      *)
        FATAL "No AMI mapping for system ${SPREAD_SYSTEM}"
        ;;
      esac

      echo "====> Looking up latest AMI for ${SPREAD_SYSTEM}..."
      AMI_ID=$(aws ec2 describe-images --region "$REGION" \
        --owners 099720109477 \
        --filters "Name=name,Values=${AMI_FILTER}" "Name=state,Values=available" \
        --query 'sort_by(Images, &CreationDate)[-1].ImageId' \
        --output text)
      if [ -z "$AMI_ID" ] || [ "$AMI_ID" = "None" ]; then
        FATAL "No AMI found for ${SPREAD_SYSTEM} in ${REGION}"
      fi
      echo "====> Using AMI: ${AMI_ID}"

      echo "====> Creating key pair ${PREFIX}..."
      # Redirect the key straight into its file: an xtraced assignment
      # (KEY_MATERIAL=$(...)) prints the key into the CI log, and
      # merging stderr (2>&1) corrupts the PEM with warning text.
      # Hard failures exit via set -e; the check below only catches a
      # success that produced nothing.
      PEM_FILE="/tmp/${PREFIX}.pem"
      aws ec2 create-key-pair --region "$REGION" \
        --key-name "$PREFIX" --query 'KeyMaterial' --output text >"$PEM_FILE"
      if [ ! -s "$PEM_FILE" ]; then
        FATAL "Failed to create key pair ${PREFIX}"
      fi
      chmod 600 "$PEM_FILE"

      echo "====> Creating security group ${PREFIX}-sg..."
      SG_ID=$(aws ec2 create-security-group --region "$REGION" \
        --group-name "${PREFIX}-sg" \
        --description "Spread test ${PREFIX}" \
        --query 'GroupId' --output text)
      # The instance accepts password SSH for a sudo-capable user and
      # the run holds AWS credentials, so scope the ingress rule to this
      # runner's egress address rather than the whole internet.
      RUNNER_IP="$(curl -fsS https://checkip.amazonaws.com)"
      if [[ ! "$RUNNER_IP" =~ ^[0-9]+(\.[0-9]+){3}$ ]]; then
        FATAL "could not determine the runner egress IP for ${PREFIX}-sg"
      fi
      aws ec2 authorize-security-group-ingress --region "$REGION" \
        --group-id "$SG_ID" --protocol tcp --port 22 --cidr "${RUNNER_IP}/32"

      # Build cloud-config user-data with the spread password.
      cloud_config="$(mktemp)"
      # Spread runs allocate under xtrace; keep the spread password out
      # of the expanded command line in the CI log. Escape sed
      # replacement metacharacters (&, \, and the | delimiter) in the
      # password so one containing them cannot corrupt the user-data.
      { set +x; } 2>/dev/null
      password_escaped="$(printf '%s' "${SPREAD_PASSWORD}" | sed -e 's/[&|\\]/\\&/g')"
      sed "s|SPREAD_PASSWORD|${password_escaped}|g" \
        tests/spread/cloud-config.yaml > "$cloud_config"
      set -x

      # Keep the base64 user-data (it embeds the spread password) out of
      # the xtrace: assignments print their substituted value too.
      { set +x; } 2>/dev/null
      USER_DATA="$(base64 -w0 < "$cloud_config")"
      set -x
      rm -f "$cloud_config"

      echo "====> Launching EC2 instance (${SPREAD_SYSTEM})..."
      # The user-data embeds the spread password (base64-encoded); keep
      # the whole launch out of the xtrace. AWS errors still reach the
      # CI log through the command's own stderr.
      { set +x; } 2>/dev/null
      INSTANCE_ID=$(aws ec2 run-instances --region "$REGION" \
        --image-id "$AMI_ID" \
        --instance-type "${EC2_INSTANCE_TYPE:-m5.xlarge}" \
        --key-name "$PREFIX" \
        --iam-instance-profile "Name=${EC2_INSTANCE_PROFILE}" \
        --security-group-ids "$SG_ID" \
        --block-device-mappings '[{"DeviceName":"/dev/sda1","Ebs":{"VolumeSize":40,"VolumeType":"gp3"}}]' \
        --user-data "$USER_DATA" \
        --tag-specifications "ResourceType=instance,Tags=[{Key=Name,Value=${PREFIX}},{Key=SpreadPrefix,Value=${PREFIX}}]" \
        --query 'Instances[0].InstanceId' \
        --output text)
      set -x
      echo "====> Launched instance: ${INSTANCE_ID}"

      aws ec2 wait instance-running --region "$REGION" --instance-ids "$INSTANCE_ID"

      IP=$(aws ec2 describe-instances --region "$REGION" \
        --instance-ids "$INSTANCE_ID" \
        --query 'Reservations[0].Instances[0].PublicIpAddress' \
        --output text)
      if [ -z "$IP" ] || [ "$IP" = "None" ]; then
        FATAL "Instance ${INSTANCE_ID} has no public IP"
      fi

      # Wait for cloud-init to create the spread user.
      echo "====> Waiting for cloud-init on ${IP}..."
      ready=false
      for _ in $(seq 1 60); do
        if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 \
          -o UserKnownHostsFile=/dev/null \
          -i "$PEM_FILE" "ubuntu@${IP}" \
          'id -u spread' &>/dev/null; then
          ready=true
          break
        fi
        sleep 5
      done
      if [[ "$ready" != true ]]; then
        FATAL "spread user did not become reachable on ${IP}"
      fi

      rm -f "$PEM_FILE"
      trap - EXIT
      ADDRESS "${IP}"
    discard: |
      export PATH="/snap/bin:/usr/local/bin:$PATH"
      REGION="${AWS_DEFAULT_REGION:-us-east-1}"
      ADDR="${SPREAD_SYSTEM_ADDRESS%%:*}"

      INSTANCE_ID=$(aws ec2 describe-instances --region "$REGION" \
        --filters "Name=ip-address,Values=${ADDR}" \
                  "Name=instance-state-name,Values=running,pending,stopping,stopped" \
        --query 'Reservations[0].Instances[0].InstanceId' \
        --output text 2>/dev/null)

      if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
        # A stopped instance has no public IP, so the ip-address filter
        # cannot match it; fall back to the per-run SpreadPrefix tag,
        # which survives stop/start. Clean up only when exactly one
        # tagged instance exists, so a concurrent run is never taken.
        IDS=$(aws ec2 describe-instances --region "$REGION" \
          --filters "Name=tag-key,Values=SpreadPrefix" \
                    "Name=instance-state-name,Values=running,pending,stopping,stopped" \
          --query 'Reservations[].Instances[].InstanceId' --output text)
        set -- $IDS
        if [ "$#" -ne 1 ]; then
          echo "No unique SpreadPrefix-tagged instance found for ${ADDR}; skipping cleanup"
          exit 0
        fi
        INSTANCE_ID="$IDS"
      fi

      PREFIX=$(aws ec2 describe-instances --region "$REGION" \
        --instance-ids "$INSTANCE_ID" \
        --query 'Reservations[0].Instances[0].Tags[?Key==`SpreadPrefix`].Value | [0]' \
        --output text 2>/dev/null)

      echo "====> Terminating EC2 instance ${INSTANCE_ID}..."
      aws ec2 terminate-instances --region "$REGION" --instance-ids "$INSTANCE_ID"
      aws ec2 wait instance-terminated --region "$REGION" --instance-ids "$INSTANCE_ID"

      if [ -n "$PREFIX" ] && [ "$PREFIX" != "None" ]; then
        echo "====> Cleaning up key pair and security group for ${PREFIX}..."
        aws ec2 delete-key-pair --region "$REGION" --key-name "$PREFIX" 2>/dev/null || true
        SG_ID=$(aws ec2 describe-security-groups --region "$REGION" \
          --filters "Name=group-name,Values=${PREFIX}-sg" \
          --query 'SecurityGroups[0].GroupId' --output text 2>/dev/null)
        if [ -n "$SG_ID" ] && [ "$SG_ID" != "None" ]; then
          aws ec2 delete-security-group --region "$REGION" --group-id "$SG_ID" 2>/dev/null || true
        fi
      fi
    prepare: |
      export PATH="$SPREAD_PATH/../go/bin:$PATH"

      snap install aws-cli --classic 2>/dev/null || true
      # snapcraft builds the controller snap via its LXD provider, so the
      # runner VM needs LXD initialised before juju bootstrap can build it.
      snap install lxd
      lxd waitready --timeout=30
      lxd init --auto
    environment:
      BOOTSTRAP_PROVIDER: ec2
      BOOTSTRAP_CLOUD: aws
      # Bootstrap inside the runner authenticates with the host's CI
      # credentials, delivered over the spread SSH channel — never EC2
      # user-data, which any process on the instance reads back via IMDS
      # and anyone with DescribeInstanceAttribute fetches from the API.
      # The instance profile attached by allocate cannot drive bootstrap:
      # juju's ec2 credential detection never queries IMDS
      # (internal/provider/ec2/credentials.go), and an instance-role
      # credential is incompatible with the bootstrap instance-role
      # constraint the controller would need (environs/bootstrap:
      # NotSupported). It only serves runner-side tooling such as aws-cli.
      AWS_ACCESS_KEY_ID: '$(HOST: echo "${AWS_ACCESS_KEY_ID:-}")'
      AWS_SECRET_ACCESS_KEY: '$(HOST: echo "${AWS_SECRET_ACCESS_KEY:-}")'
      AWS_SESSION_TOKEN: '$(HOST: echo "${AWS_SESSION_TOKEN:-}")'
    systems:
      - ubuntu-22.04:
          username: spread
          workers: 1
      - ubuntu-24.04:
          username: spread
          workers: 1

exclude:
  - _build
  - _deps
  - .git
  - .github

# Path must be under /root because spread executes test scripts as root,
# and juju (snap-confined) can only see files in root's home directory.
path: /root/proj

prepare: |
  snap refresh --hold
  if systemctl is-enabled unattended-upgrades.service; then
      systemctl stop unattended-upgrades.service
      systemctl mask unattended-upgrades.service
  fi

  pushd "$SPREAD_PATH"

  GOBIN="$PWD/../go/bin"
  mkdir -p "$GOBIN"

  # In CI the binaries are built in the build job and staged into the project
  # under .spread-bin; copy them in and skip the in-VM build. For local runs
  # .spread-bin is absent and we build in the VM as before.
  if [[ -f "$SPREAD_PATH/.spread-bin/juju" && -f "$SPREAD_PATH/.spread-bin/jujuagentd" ]]; then
      cp "$SPREAD_PATH/.spread-bin/juju" "$GOBIN/juju"
      cp "$SPREAD_PATH/.spread-bin/jujuagentd" "$GOBIN/jujuagentd"
      echo "====> Using prebuilt juju/jujuagentd binaries staged from CI"
  fi

  if [[ -f "$GOBIN/juju" ]]; then
      chown $(id -u):$(id -g) "$GOBIN/juju"
      chmod a+x "$GOBIN/juju"
  else
      apt-get update
      apt-get install -y build-essential
      snap install go --classic
      make juju
  fi

  if [[ -f "$GOBIN/jujuagentd" ]]; then
      chown $(id -u):$(id -g) "$GOBIN/jujuagentd"
      chmod a+x "$GOBIN/jujuagentd"
  else
      apt-get update
      apt-get install -y build-essential
      snap install go --classic
      make jujuagentd
  fi

  export PATH="$GOBIN:$PATH"

  # Install charmcraft for tests that pack local charms.
  snap install charmcraft --classic
  snap install yq

  # Bootstrapping a dev build that is newer than the published controller
  # snap builds the controller snap locally via `make jujud-snap-build`,
  # which needs snapcraft and make available in the VM.
  snap install snapcraft --classic
  apt-get update
  apt-get install -y make

restore: |
  export PATH="$SPREAD_PATH/../go/bin:$PATH"

  # Clean up any leftover controllers.
  for ctrl in $(juju controllers --format=json 2>/dev/null | yq -r '.controllers // {} | keys[]' 2>/dev/null); do
      juju destroy-controller --no-prompt --destroy-all-models --destroy-storage "$ctrl" 2>/dev/null || true
  done

suites:
  tests/spread/deploy/:
    summary: Deploy integration tests
    environment:
      # Shared across the suite's prepare/execute/restore hooks so the
      # controller bootstrapped in `prepare` is reused by every task's
      # `ensure` and cleaned up in `restore`.
      TEST_DIR: /tmp/spread-juju-deploy
      # ensure()'s reuse check (juju.sh) forces a re-bootstrap when this is
      # empty, so it must be a concrete base matching the bootstrapped
      # controller. The ad hoc VM defaults to noble (24.04).
      BOOTSTRAP_BASE: ubuntu@24.04
    kill-timeout: 30m
    prepare: |
      export PATH="$SPREAD_PATH/../go/bin:$PATH"
      . "$TESTSLIB/spread-env.sh"

      # Bootstrap the suite controller once (unless one is already recorded
      # and still alive), then have every task reuse it via `ensure`.
      last_ctrl="$(tail -n 1 "${TEST_DIR}/jujus" 2>/dev/null || true)"
      if [[ -z "${last_ctrl}" ]] || ! juju controllers --format=json 2>/dev/null | yq -r '.controllers // {} | keys[]' | grep -qx "${last_ctrl}"; then
          bootstrap "test-deploy" "${TEST_DIR}/test-deploy-bootstrap.log"
      fi
    debug-each: |
      export PATH="$SPREAD_PATH/../go/bin:$PATH"
      juju status 2>&1 || true
    restore: |
      export PATH="$SPREAD_PATH/../go/bin:$PATH"
      . "$TESTSLIB/spread-env.sh"

      # Destroy the actually bootstrapped (random-named) controllers.
      for ctrl in $(cat "${TEST_DIR}/jujus" 2>/dev/null || true); do
          destroy_controller "${ctrl}" || true
      done
      rm -f "${TEST_DIR}/jujus" || true
    prepare-each: |
      export PATH="$SPREAD_PATH/../go/bin:$PATH"
      . "$TESTSLIB/spread-env.sh"
    restore-each: |
      export PATH="$SPREAD_PATH/../go/bin:$PATH"
      . "$TESTSLIB/spread-env.sh"
