name: "Spread"

on:
  workflow_dispatch:

concurrency:
  group: spread-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-binaries:
    name: Build binaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: "go.mod"
          cache: false

      - name: Install build deps
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential

      - name: Build juju + jujuagentd
        # Built once and shared with the spread jobs via an artifact so each
        # spread job does not rebuild in the VM (~10-15 min per job).
        run: |
          mkdir -p .spread-bin
          GOBIN="$PWD/.spread-bin" make juju
          GOBIN="$PWD/.spread-bin" make jujuagentd

      - name: Build patched spread
        # Upstream spread's SendTar emits 'tar --no-same-owner xz' which GNU tar
        # misparses (bare 'xz' treated as a file operand), breaking project
        # delivery. Build from the fixed source. See tests/spread/README.md.
        run: |
          git clone https://github.com/canonical/spread /tmp/spread-src
          git -C /tmp/spread-src checkout 32cad07bfd7fffb395f6c6134b68b1c24f9490c0
          sed -i 's|/bin/tar --no-same-owner xz 2>&1|/bin/tar -xz --no-same-owner 2>&1|' /tmp/spread-src/spread/client.go
          (cd /tmp/spread-src && GOBIN="$GITHUB_WORKSPACE/.spread-bin" go install ./cmd/spread)

      - name: Verify built binaries
        run: |
          for binary in juju jujuagentd spread; do
            test -x ".spread-bin/$binary"
            file ".spread-bin/$binary"
          done

      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spread-bin
          if-no-files-found: error
          path: |
            .spread-bin/juju
            .spread-bin/jujuagentd
            .spread-bin/spread

  build-controller-snap:
    name: Build controller snap
    # Bootstrap of a dev build newer than the published controller snap
    # builds the snap locally via snapcraft's LXD provider. That provider
    # cannot run on GitHub-hosted runners (craft-providers network
    # failures) nor inside the nested-LXD test VMs (snapd cannot start two
    # levels down). The self-hosted runners already run LXD for the spread
    # jobs and can run snapcraft's containerised builds.
    runs-on:
      - self-hosted
      - linux
      - x64
      - aws
      - xxlarge
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install snapcraft
        # Major-version pin: 9.x/stable still tracks 9.x minor refreshes
        # (snap channels cannot pin an exact revision); only a snapcraft
        # major refresh is excluded. Pin an exact revision here instead
        # if reproducible snap builds ever start to matter.
        run: |
          snap list snapcraft >/dev/null 2>&1 || \
            sudo snap install snapcraft --channel 9.x/stable --classic

      - name: Setup LXD
        uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee # v1

      - name: Wait for LXD
        run: |
          timeout=600
          start=$SECONDS
          while ! ip link show lxdbr0; do
            if (( SECONDS - start > timeout )); then
              echo "Timed out waiting for lxdbr0 after ${timeout}s"
              exit 1
            fi
            echo "Waiting for lxdbr0..."
            sleep 10
          done

      # Same recipe as .github/workflows/snap.yml: do not use the
      # Makefile jujud-snap target here, its mv step derives the file
      # name from `go env GOARCH` and this job has no Go installed.
      - name: Build jujud controller snap
        run: |
          rm -rf snap _build/snap
          mkdir -p snap _build/snap
          cp -a snaps/jujud/. snap/
          snapcraft --use-lxd --output _build/snap || {
            log=$(ls -t "$HOME"/.local/state/snapcraft/log/*.log 2>/dev/null | head -1)
            [ -n "$log" ] && tail -n 100 "$log"
            exit 1
          }
          cp _build/snap/jujud_*.snap jujud-controller.snap

      - name: Upload controller snap
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jujud-controller-snap
          if-no-files-found: error
          path: jujud-controller.snap

  spread-lxd:
    name: "spread-lxd (${{ matrix.system }}): ${{ matrix.suite }}"
    needs: [build-binaries, build-controller-snap]
    runs-on:
      - self-hosted
      - linux
      - x64
      - aws
      # Adjust size/labels to match the org's LXD-capable self-hosted runners
      # (see .github/workflows/smoke.yml).
      - xxlarge
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        system: [ubuntu-22.04]
        suite: [tests/spread/deploy/...]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download prebuilt binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: spread-bin
          path: .spread-bin

      - name: Download controller snap
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jujud-controller-snap
          path: .spread-bin

      - name: Restore binary permissions
        run: chmod +x .spread-bin/juju .spread-bin/jujuagentd .spread-bin/spread

      - name: Setup LXD
        uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee # v1

      - name: Wait for LXD
        run: |
          while ! ip link show lxdbr0; do
            echo "Waiting for lxdbr0..."
            sleep 10
          done

      - name: Relax unprivileged userns restriction
        id: userns
        # snapd inside the nested LXD containers must create user and
        # mount namespaces for snap-confine; newer kernels restrict
        # unprivileged userns creation via apparmor, which shows up as
        # "cannot change profile ... Permission denied" from snap-confine.
        # The sysctl is global to this shared runner machine (not
        # namespaced, and /proc/sys is read-only inside the test
        # containers), so remember the previous value and restore it
        # in the post step below, whatever the outcome of the run.
        run: |
          current=$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo absent)
          echo "apparmor_restrict_unprivileged_userns: ${current}"
          echo "original=${current}" >> "$GITHUB_OUTPUT"
          # Relax on any non-zero value; the restriction is reported
          # as values other than a bare 1 on newer kernels.
          if [ "$current" != "absent" ] && [ "$current" != "0" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Run spread
        run: |
          .spread-bin/spread -v lxd:${{ matrix.system }}:${{ matrix.suite }}

      - name: Restore unprivileged userns restriction
        # Runs even when "Run spread" fails or the job is cancelled;
        # only restores when the relax step actually changed the value,
        # and restores the remembered value rather than a hardcoded one.
        if: always() && steps.userns.outputs.original != '' && steps.userns.outputs.original != 'absent' && steps.userns.outputs.original != '0'
        env:
          USERNS_ORIGINAL: ${{ steps.userns.outputs.original }}
        run: |
          sudo sysctl -w "kernel.apparmor_restrict_unprivileged_userns=$USERNS_ORIGINAL"
          echo "restored apparmor_restrict_unprivileged_userns=$USERNS_ORIGINAL"

  spread-ec2:
    name: "spread-ec2 (${{ matrix.system }}): ${{ matrix.suite }}"
    needs: [build-binaries, build-controller-snap]
    runs-on:
      - self-hosted
      - linux
      - x64
      - aws
      - xxlarge
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        system: [ubuntu-22.04]
        suite: [tests/spread/deploy/deploy-charm]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download prebuilt binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: spread-bin
          path: .spread-bin

      - name: Download controller snap
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jujud-controller-snap
          path: .spread-bin

      - name: Restore binary permissions
        run: chmod +x .spread-bin/juju .spread-bin/jujuagentd .spread-bin/spread

      - name: Ensure runner-side tools for spread allocate
        # The ec2 allocate/discard scripts run on this shared runner
        # host, not in the test VM: they need aws-cli plus core tools.
        # The aws-cli install in the ec2 backend prepare runs inside
        # the test VM and does not cover the host.
        run: |
          snap list aws-cli >/dev/null 2>&1 || sudo snap install aws-cli --classic
          command -v ssh base64 curl od sed >/dev/null

      - name: Run spread on ec2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          EC2_INSTANCE_PROFILE: ${{ secrets.EC2_INSTANCE_PROFILE }}
        run: |
          .spread-bin/spread -v ec2:${{ matrix.system }}:${{ matrix.suite }}
