name: "Snapcraft"
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  snap:
    name: Build linux-arm64
    runs-on:
      - self-hosted
      - linux
      - arm64
      - ${{ (github.repository_owner == 'juju' && 'aws') || (github.repository_owner == 'canonical' && 'noble') }}
      - ${{ (github.repository_owner == 'juju' && 'quad-xlarge') || (github.repository_owner == 'canonical' && 'xlarge') }}

    steps:
      - name: Install Dependencies
        shell: bash
        run: |
          set -euxo pipefail
          action=$(snap info snapcraft | grep -q "installed" || echo "install")
          if [ "$action" == "" ]; then
              action="refresh"
          fi
          sudo snap $action snapcraft --channel 9.x --classic
          echo "/snap/bin" >> $GITHUB_PATH

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Squid"
        if: github.repository_owner != 'juju'
        run: ./.github/squid.sh

      - name: Setup LXD
        uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee # v1

      - name: Wait for LXD
        run: |
          timeout=600
          start=$SECONDS
          while ! ip link show lxdbr0; do
            if (( SECONDS - start > timeout )); then
              echo "Timed out waiting for lxdbr0 after ${timeout}s"
              exit 1
            fi
            echo "Waiting for lxdbr0..."
            sleep 10
          done

      - name: Build snap
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf snap _build/snap
          mkdir -p snap _build/snap
          cp -a snaps/juju/. snap/
          snapcraft --use-lxd --output _build/snap

      - name: Install snap
        shell: bash
        run: |
          set -euxo pipefail
          sudo snap install _build/snap/*.snap --dangerous
          # Since we're installing dangerously, we need to
          # manually grant permissions to juju
          sudo snap connect juju:lxd lxd
          sudo snap connect juju:config-lxd
          sudo snap connect juju:dot-local-share-juju
          sudo snap connect juju:ssh-keys
          snap connections juju

      # The client snap must be built and installed before the controller
      # snap: this step wipes _build/snap, which is safe once the client
      # snap is installed system-wide.
      - name: Build jujud snap
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf snap _build/snap
          mkdir -p snap _build/snap
          cp -a snaps/jujud/. snap/
          snapcraft --use-lxd --output _build/snap

      # The freshly built client snap is newer than any published controller
      # snap, so the controller snap is supplied explicitly and the machine
      # agent is copied from the client snap's bundled binaries. No Go or
      # other host build tools are needed: the client snap ships the
      # unsquashfs used to inspect the controller snap's version. The juju
      # snap is strictly confined and cannot read the workspace checkout,
      # so the controller snap is staged in the auto-connected home
      # directory before bootstrapping.
      - name: Test bootstrap
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p ~/.ssh
          cp _build/snap/jujud_*.snap "$HOME"/
          juju bootstrap --controller-snap-path "$HOME"/jujud_*.snap localhost --debug
