name: "Build"
on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    name: Build
    runs-on:
      - self-hosted
      - linux
      - ${{ matrix.platform.host_arch }}
      - ${{ (github.repository_owner == 'juju' && 'aws') || (github.repository_owner == 'canonical' && 'noble') }}
      - ${{ (github.repository_owner == 'juju' && 'xxlarge') || (github.repository_owner == 'canonical' && 'xlarge') }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: linux, arch: amd64, host_arch: x64, cc: gcc }
          - { os: linux, arch: arm64, host_arch: arm64, cc: gcc }
          # Cross builds run on x64 hosts and link the target architecture's
          # Dqlite libraries through dpkg multiarch (ppa:dqlite/dev publishes
          # arch-qualified packages for both architectures).
          - { os: linux, arch: s390x, host_arch: x64, deb_arch: s390x, cc: s390x-linux-gnu-gcc }
          - { os: linux, arch: ppc64le, host_arch: x64, deb_arch: ppc64el, cc: powerpc64le-linux-gnu-gcc }
          - { os: darwin, arch: arm64, host_arch: arm64, cc: clang }

    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Squid"
        if: github.repository_owner != 'juju'
        run: ./.github/squid.sh

      - name: "Set up Go"
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: false

      # jujud is a native CGO build on every linux entry; darwin does not
      # build jujud (the agent platform lists filter it to linux). Cross
      # entries additionally install their target architecture's
      # arch-qualified Dqlite packages via dpkg multiarch and select their
      # cross compiler for the build below.
      - name: "Install dependencies"
        if: matrix.platform.os == 'linux'
        env:
          DQLITE_CROSS_ARCHES: ${{ matrix.platform.deb_arch }}
        run: make install-dependencies

      - name: "Build"
        env:
          CC: ${{ matrix.platform.cc }}
        run: |
          GOOS=${{ matrix.platform.os }} GOARCH=${{ matrix.platform.arch }} make go-build
