name: "Build"
on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    name: Build
    runs-on:
      - self-hosted
      - linux
      - ${{ matrix.platform.host_arch }}
      - ${{ (github.repository_owner == 'juju' && 'aws') || (github.repository_owner == 'canonical' && 'noble') }}
      - ${{ (github.repository_owner == 'juju' && 'xxlarge') || (github.repository_owner == 'canonical' && 'xlarge') }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: linux, arch: amd64, host_arch: x64 }
          - { os: linux, arch: arm64, host_arch: arm64 }
          - { os: darwin, arch: arm64, host_arch: arm64 }

    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Squid"
        if: github.repository_owner != 'juju'
        run: ./.github/squid.sh

      - name: "Set up Go"
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: false

      # jujud is a native CGO build on every linux entry and links against
      # the host's Dqlite libraries (ppa:dqlite/dev); darwin does not build
      # jujud (the agent platform lists filter it to linux). Only the CGO
      # link-time deps are needed; the full install-dependencies set (snaps,
      # squashfs-tools) is not required for a build-only workflow.
      - name: "Install dependencies"
        if: matrix.platform.os == 'linux'
        run: make install-dqlite-dependencies

      - name: "Build"
        run: |
          GOOS=${{ matrix.platform.os }} GOARCH=${{ matrix.platform.arch }} make go-build
