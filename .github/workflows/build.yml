name: "Build"
on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    name: Build
    runs-on:
      - self-hosted
      - linux
      - ${{ matrix.platform.host_arch }}
      - ${{ (github.repository_owner == 'juju' && 'aws') || (github.repository_owner == 'canonical' && 'noble') }}
      - ${{ (github.repository_owner == 'juju' && 'xxlarge') || (github.repository_owner == 'canonical' && 'xlarge') }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: linux, arch: amd64, host_arch: x64 }
          - { os: linux, arch: arm64, host_arch: arm64 }
          # Until we get rid of musl, lets just disable these to save build time.
          #          - { os: linux, arch: s390x }
          #          - { os: linux, arch: ppc64le }
          - { os: darwin, arch: arm64, host_arch: arm64 }

    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Squid"
        if: github.repository_owner != 'juju'
        run: ./.github/squid.sh

      - name: "Set up Go"
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: "go.mod"
          cache: false

      - name: "Build"
        run: |
          GOOS=${{ matrix.platform.os }} GOARCH=${{ matrix.platform.arch }} make go-build
