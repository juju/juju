name: Export Version
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  export-version:
    name: Check export payload version sync
    runs-on: ubuntu-latest
    # Skip draft PRs; dispatch has no pull_request context.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: false

      - name: Check released versions frozen
        run: ./.github/check-export-version-frozen.sh

      - name: Check freshness
        run: ./.github/check-export-version-freshness.sh

      - name: Check sync
        run: ./.github/check-export-version-sync.sh
