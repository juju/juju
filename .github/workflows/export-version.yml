name: Export Version
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  export-version:
    name: Check export payload version sync
    runs-on: ubuntu-latest
    # Skip draft PRs; dispatch has no pull_request context.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: "go.mod"
          cache: false

      - name: Check freshness
        run: ./.github/check-export-version-freshness.sh

      - name: Check sync
        run: ./.github/check-export-version-sync.sh
