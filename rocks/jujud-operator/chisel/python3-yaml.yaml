package: python3-yaml

essential:
  - python3-yaml_copyright

slices:
  # PyYAML is not covered by the upstream Noble Chisel release, but the
  # juju-db-repl and juju-safemode controller wrappers parse runtime.conf
  # with yaml.safe_load. The pure-Python package and its compiled _yaml
  # extension both live under dist-packages.
  libs:
    essential:
      - python3_standard
      - libyaml-0-2_libs
    contents:
      /usr/lib/python3/dist-packages/yaml/**:
      /usr/lib/python3/dist-packages/_yaml/**:
  copyright:
    contents:
      /usr/share/doc/python3-yaml/copyright:
